[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appimage-integrator"
version = "0.2.0"
description = "Safe, reversible, per-user desktop integration for Linux AppImages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AppImage Integrator contributors" }]
keywords = ["appimage", "linux", "desktop", "launcher"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: System :: Installation/Setup",
]

[project.scripts]
appimage-integrator = "appimage_integrator.cli:main"
appimage-integrator-gui = "appimage_integrator.gui:main"

[tool.setuptools.packages.find]
include = ["appimage_integrator*"]
